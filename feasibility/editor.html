<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BranchCast shape editor</title><link rel="stylesheet" href="../style.css"><style>body{padding:30px;max-width:1100px;margin:auto}.controls{margin:20px 0;display:flex;gap:10px;flex-wrap:wrap}.board{height:600px;position:relative;border:1px solid #444;background:#1c1c23;background-image:radial-gradient(#37353f 1px,transparent 1px);background-size:20px 20px;overflow:hidden}.shape{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;resize:both;overflow:auto;min-width:30px;min-height:24px;border:1px solid #b9a0fa;background:#30283d;color:white;cursor:move;padding:5px}.shape.ellipse{border-radius:50%}.shape.diamond{border-style:dashed}.shape.arrow{background:transparent;border:0;border-bottom:2px solid #b9a0fa;min-height:20px}input[type=file]{max-width:100%}</style></head><body><div class="eyebrow">STAGE 2 · FEASIBILITY</div><h1>Editable shape preview</h1><p class="subtitle">Load the JSON produced by diagram.py. Drag, resize, and edit shapes, then download your changes.</p><div class="controls"><label class="btn">Open diagram JSON <input id="file" type="file" accept="application/json,.json"></label><button class="btn primary" id="save">Download edited JSON</button><a class="btn" href="../index.html">Back to prototype</a></div><p id="status" class="subtitle" role="status">No diagram loaded.</p><div id="board" class="board" aria-label="Editable diagram"></div><script src="editor.js"></script></body></html>
